run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gocritic
    - gofmt
    - goimports
    - misspell
    - noctx
    - revive
    - sqlclosecheck

issues:
  exclude-rules:
    - path: _test\.go
      linters: [noctx]
